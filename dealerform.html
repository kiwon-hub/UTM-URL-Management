<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>대리점 계약문의 신청 - 기원툴스</title>
<meta name="description" content="기원툴스 대리점 계약문의 신청 페이지입니다. 지역/취급품목을 남겨주시면 담당자가 연락드립니다." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232f6fed'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif'%3ED%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <h1>대리점 계약문의</h1>
  <nav class="tabs">
    <a class="tab-btn" href="index.html">UTM URL 생성</a>
    <a class="tab-btn" href="dealer-admin.html">문의 관리</a>
  </nav>
</header>

<main>
  <section class="form-intro">
    <h2>기원툴스 대리점 계약문의</h2>
    <p>아래 내용을 남겨주시면 담당자가 <strong>영업일 기준 1~2일 내</strong>에 연락드립니다.
      지역·취급 품목에 따라 공급 조건이 달라지므로 가능한 한 자세히 적어주세요.</p>
  </section>

  <form id="dealerForm" class="dealer-form" novalidate>
    <fieldset class="form-block">
      <legend>업체 정보</legend>

      <div class="field">
        <label for="company">회사명 <span class="req">필수</span></label>
        <input type="text" id="company" name="company" autocomplete="organization" placeholder="예: 기원공구상사" required />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="name">담당자명 <span class="req">필수</span></label>
          <input type="text" id="name" name="name" autocomplete="name" placeholder="예: 홍길동" required />
        </div>
        <div class="field">
          <label for="position">직함</label>
          <input type="text" id="position" name="position" placeholder="예: 대표 / 영업팀장" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="phone">연락처 <span class="req">필수</span></label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="numeric" placeholder="010-0000-0000" required />
        </div>
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="example@company.com" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="region">희망 지역 <span class="req">필수</span></label>
          <select id="region" name="region" required>
            <option value="" selected disabled>지역을 선택하세요</option>
            <option>서울</option><option>경기</option><option>인천</option>
            <option>강원</option><option>대전/세종</option><option>충남</option><option>충북</option>
            <option>대구</option><option>경북</option><option>부산</option><option>울산</option><option>경남</option>
            <option>광주</option><option>전남</option><option>전북</option><option>제주</option>
            <option>해외</option>
          </select>
        </div>
        <div class="field">
          <label for="bizType">사업자 형태</label>
          <select id="bizType" name="bizType">
            <option value="" selected disabled>선택하세요</option>
            <option>공구상 / 유통</option>
            <option>제조업체</option>
            <option>온라인 판매</option>
            <option>신규 창업 예정</option>
            <option>기타</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset class="form-block">
      <legend>문의 내용</legend>

      <div class="field-row">
        <div class="field">
          <label for="items">취급(희망) 품목</label>
          <input type="text" id="items" name="items" placeholder="예: 엔드밀, PCD인서트, 툴링" />
        </div>
        <div class="field">
          <label for="volume">예상 월 거래 규모</label>
          <select id="volume" name="volume">
            <option value="" selected disabled>선택하세요</option>
            <option>500만원 미만</option>
            <option>500만~2,000만원</option>
            <option>2,000만~5,000만원</option>
            <option>5,000만원 이상</option>
            <option>아직 모름</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="message">추가로 남기실 내용</label>
        <textarea id="message" name="message" rows="5" placeholder="현재 취급 중인 브랜드, 거래처 성격, 궁금한 조건 등을 적어주세요."></textarea>
      </div>

      <div class="field check-field">
        <label class="check">
          <input type="checkbox" id="agree" name="agree" required />
          <span>[필수] 개인정보 수집·이용에 동의합니다.</span>
        </label>
        <p class="hint">수집 항목: 회사명, 담당자명, 연락처, 이메일, 지역, 문의내용 ·
          이용 목적: 대리점 계약 상담 · 보유 기간: 상담 종료 후 1년 (동의 거부 시 상담이 어렵습니다.)</p>
      </div>
    </fieldset>

    <!-- 광고에서 넘어온 유입 정보. 사용자에겐 보이지 않고 문의 데이터에 함께 저장된다. -->
    <input type="hidden" id="utm_source" name="utm_source" />
    <input type="hidden" id="utm_medium" name="utm_medium" />
    <input type="hidden" id="utm_campaign" name="utm_campaign" />
    <input type="hidden" id="utm_content" name="utm_content" />
    <input type="hidden" id="utm_term" name="utm_term" />

    <p class="form-error" id="formError" role="alert"></p>

    <div class="form-actions">
      <button type="submit" class="btn-primary btn-lg" id="submitBtn">계약문의 신청하기</button>
    </div>

    <p class="utm-badge" id="utmBadge" hidden></p>
  </form>

  <section class="form-done hidden" id="doneBox">
    <h2>신청이 접수되었습니다.</h2>
    <p>담당자가 남겨주신 연락처로 <strong>영업일 기준 1~2일 내</strong>에 연락드리겠습니다.</p>
    <p class="hint" id="doneUtm"></p>
    <div class="form-actions">
      <button type="button" class="btn-secondary" id="againBtn">다른 건으로 다시 신청</button>
    </div>
  </section>
</main>

<script src="dealer-common.js"></script>
<script src="dealer-form.js"></script>
</body>
</html>
